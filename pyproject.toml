[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rettune"
version = "0.1.0"
description = "A reproducible testbed for profiling foundational hybrid search (Layer 1 RAG)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "tabulate>=0.9.0",
    "datasets>=3.0.0",
    "huggingface-hub>=0.25.0",
    "pyarrow>=20.0.0",
    "bm25s>=0.3.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools]
packages = ["rettune", "rettune.viz"]
package-dir = {"rettune" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --strict-markers"
